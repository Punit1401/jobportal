apps:
  - name: careerandnaukariserver-backend
    script: npm
    args: start
    cwd: /var/www/careerandnaukari/backend
    instances: 1
    exec_mode: fork
    env:
      NODE_ENV: production
      PORT: 4991
    autorestart: true
    watch: false
    max_memory_restart: 300M
    time: true

  - name: careerandnaukariserver-frontend
    script: npm
    args: start
    cwd: /var/www/careerandnaukari/frontend
    instances: 1
    exec_mode: fork
    env:
      NODE_ENV: production
      PORT: 4990
    autorestart: true
    watch: false
    max_memory_restart: 300M
    time: true
